

server {
    server_name 127.0.0.1;
    listen 127.0.0.1:5050;
    max_client_body_size 2K;
    allow GET DELETE;
    autoindex on;
    upload ./var/www/storage;
    root ./var/www;
    index index.html;
    cgi .py /usr/bin/python3;



    location /home {
        allow GET POST DELETE;
        root ./var/www/website1;
        index home.html;
        autoindex on; 
    }

    location /aboutt {
        allow GET;
        root ./var/www/website1/aboutt;
        index about.html;
    }

    location /deep {
        allow GET DELETE;
        root ./var/www/website1;
        index index.html;
        autoindex on;
    }

    location /upload {
        allow GET POST;
        root ./var/www/storage/;
        index invalid;
        redirct 301 /aboutt;
        upload ./;
    }

    location / {
        allow GET DELETE POST;
        root ./var/www/;
        index index.html;
        autoindex on;
    }
}

server {
    server_name 127.0.0.1;
    listen 127.0.0.1:5051;
    root ./var/www/website1;
    index index.html;
    max_client_body_size 30000;
    allow GET DELETE;
    autoindex on;
    error_page 404 ./errors/404.html;
    # upload ./var/www/storage/;
    cgi .py /usr/bin/python3;

    location /mcha {
        allow GET DELETE;
        root ./var/www/website2/;
        index index.html;
    }

    location /upload {
        allow GET POST;
        root ./var/www/storage/;
        index invalid.html;
        upload ./;
    }

    location /scripttt {
        allow GET;
        root ./var/www/website2/;
        index script.php;
        cgi .php /usr/bin/php;
    }

    location /cgi.py {
        allow GET POST;
        root ./var/www/session/;
        index session.py;
        cgi .py /usr/bin/python3;
    }

    location /empty {
        allow GET POST;
        root ./var/www/website2/;
        index empty.html;
    }

}

server {
    server_name 127.0.0.1;
    listen 127.0.0.1:5052;
    autoindex on;
    root ./var/www;
    index index.html;


    cgi .py /usr/bin/python3;
    cgi .php /usr/bin/php;
    cgi .sh /usr/bin/sh;

    location / {
        allow GET DELETE;
        root ./var/www/;
        index index.html;
        autoindex on;
    }

    location /mcha {
        allow GET DELETE;
        root ./var/www/website2;
        index index.html;
    }

    location /cgi.py {
        allow GET POST;
        root ./var/www/session;
        index session.py;
        cgi .py /usr/bin/python3;
    }

    location /cgi.sh {
        allow GET POST;
        root ./var/www/session/;
        index session.sh;
        cgi .sh /usr/bin/sh;
    }

    location /cgi.php {
        allow GET POST;
        root ./var/www/session/;
        index session.php;
        cgi .php /usr/bin/php;
    }


}

#  This configuration creates a local web server that:
# Runs on your computer only
# Serves files from var/www folder
# Allows people to view files and delete files
# Shows all files in a folder if no homepage exists
# Stores uploads in storage folder

