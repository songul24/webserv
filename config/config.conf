#  This configuration creates a local web server that:
# Runs on your computer only
# Serves files from website1 folder
# Allows people to view files and delete files (dangerous!)
# Shows all files in a folder if no homepage exists
# Has a 2 MB upload limit
# Stores uploads in website2 folder






server {
    server_name 127.0.0.1;
    listen 8080;
    max_client_body_size 100M;
    root .public/website3/;
    index test_website.py;
    cgi .py /usr/bin/python3;

    location /upload {
        root .public/website1/;
        index index.html;
        allow GET POST;
        upload ./uploads;
    }

    location / {
        root .public/website3/;
        index test_website.py;
        allow GET POST;
        upload /uploads;
        cgi .py /bin/python3;
        cgi .php /bin/php;
        cgi .sh /bin/sh;
    }

    location /video {
        root /media/ckhater/SSD;
        index nature.mp4;
        autoindex on;
        allow GET;
    }

    location /delete {
        root var/www/uploads;
        index invalid;
        autoindex on;
        allow DELETE GET;
    }

    location /dire {
        root .public/website2/;
        index invalid;
        allow GET;
        autoindex on;
    }
}


server {
    server_name 127.0.0.1;
    listen 5051;
    root ./public/website1;
    index index.html;
    max_client_body_size 30000;
    allow GET DELETE;
    autoindex on;
    error_page 404 ./public/error_pages/404.html;
    upload ./public/website2/;
    cgi .php /usr/bin/php-cgi;

    location /mcha {
        allow GET DELETE;
        root ./public/website2/;
        index about.html;
    }

    location /upload {
        allow GET POST;
        root ./public/website2/;
        index index.html;
        upload ./;
    }

    location /action.php {
        allow GET POST;
        root ./public/website2/;
        index action.php;
        upload ./;
    }

    location /empty {
        allow GET POST;
        root ./public/website1/;
        index empty.html;
    }

    location / {
        allow GET DELETE;
        root ./public/website1/;
        index index.html;
        autoindex on;
    }
}

server {
    server_name 127.0.0.1;
    listen 5052;
    autoindex on;
    root ./storage;
    index session.py;
    cgi .py /usr/bin/python3;

    location / {
        allow GET POST;
        root ./storage;
        cgi .py /usr/bin/python3;
    }

    location /perl {
        allow GET POST;
        root ./CGI/CGI-bin;
        cgi .pl /usr/bin/perl;
    }
}



