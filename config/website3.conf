


server {
    server_name 127.0.0.2;
    listen 127.0.0.2:8080;
    max_client_body_size 100M;
    allow GET POST DELETE;
    autoindex on;
    upload /upload;
    root var/www;
    index index.html;
    cgi .py /usr/bin/python3;

    error_page 404 ./errors/404.html;
    error_page 403 ./errors/403.html;
    error_page 405 ./errors/405.html;
    error_page 408 ./errors/408.html;
    error_page 409 ./errors/409.html;
    error_page 411 ./errors/411.html;
    error_page 413 ./errors/413.html;
    error_page 414 ./errors/414.html;
    error_page 415 ./errors/415.html;
    error_page 500 ./errors/500.html;
    error_page 501 ./errors/501.html;
    error_page 502 ./errors/502.html;
    error_page 504 ./errors/504.html;

    location / {
        root var/www/website3;
        index test_website.py;
        allow GET POST;
        cgi .py /bin/python3;
        # cgi .php /bin/php;
        # cgi .sh /bin/sh;
    }

    location /video {
        root /var/ww/website3;
        index video.mp4;
        autoindex on;
        allow GET;
    }

    location /delete {
        root var/www/storage;
        index invalid;
        autoindex on;
        allow DELETE GET;
    }

    location /dire {
        root var/www;
        index invalid;
        allow GET;
        autoindex on;
    }

    location /upload {
        allow GET POST;
        root var/www;
        index index.html;
        autoindex on;
        upload /upload;
    }


    location /empty {
        allow GET POST;
        root ./var/www/website1/;
        index empty.html;
    }

}



server {
    server_name 127.0.0.1;
    listen 127.0.0.1:5052;
    autoindex on;
    root ./var/www;
    index index.html;


    cgi .py /usr/bin/python3;
    cgi .php /usr/bin/php;
    cgi .sh /usr/bin/sh;

    location / {
        allow GET DELETE;
        root ./var/www/;
        index index.html;
        autoindex on;
    }

    location /mcha {
        allow GET DELETE;
        root ./var/www/website2;
        index index.html;
    }

    location /cgi.py {
        allow GET POST;
        root ./var/www/session;
        index session.py;
        cgi .py /usr/bin/python3;
    }

    location /cgi.sh {
        allow GET POST;
        root ./var/www/session/;
        index session.sh;
        cgi .sh /usr/bin/sh;
    }

    location /cgi.php {
        allow GET POST;
        root ./var/www/session/;
        index session.php;
        cgi .php /usr/bin/php;
    }


}