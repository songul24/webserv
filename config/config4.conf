server {
    listen 127.0.0.1:8080;
    server_name 127.0.0.1;
    max_client_body_size 10000M;
    upload ../var/www/upload;
    index index.html;

    location / {
        allow GET;                  # FIX: Changed from 'GET POST' to 'GET' only
        root YoupiBanane;
        index index.html;
    }

    location /post_body {
        allow POST;
        # max_client_body_size 100;
        root YoupiBanane;
        upload ../var/www/upload;
    }

    location /directory/ {          # FIX: Added trailing slash
        allow GET POST;
        root YoupiBanane;
        index youpi.bad_extension;
        # cgi .bla ./cgi_tester;
        # autoindex on;
    }

    location /youpi.bla {                 # FIX: Match any .bla extension, not just /youpi.bla
        allow POST;
        cgi .bla ./cgi_tester;
    }
}
